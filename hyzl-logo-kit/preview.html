<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<title>hyzl — logo kit preview</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<style>
  body{font-family:-apple-system,'Segoe UI',sans-serif;margin:0;background:#f4f5f7;color:#16181D}
  h1{font-size:18px;padding:24px 32px 0}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:20px;padding:24px 32px 48px}
  .card{border-radius:14px;padding:28px;display:flex;flex-direction:column;gap:18px;align-items:center;justify-content:center;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.08)}
  .card.dark{background:#16181D;color:#fff}
  .card span{font-size:12px;opacity:.6}
  img.logo{width:80%;max-width:280px}
  img.icon{width:96px}
  .favrow{display:flex;gap:16px;align-items:flex-end}
</style></head><body>
<h1>hyzl — logo kit</h1>
<div class="grid">
  <div class="card"><img class="logo" src="hyzl-logo.svg"><span>hyzl-logo.svg — primary</span></div>
  <div class="card dark"><img class="logo" src="hyzl-logo-white.svg"><span>hyzl-logo-white.svg — dark bg</span></div>
  <div class="card"><img class="logo" style="max-width:170px" src="hyzl-logo-stacked.svg"><span>hyzl-logo-stacked.svg</span></div>
  <div class="card dark"><img class="logo" style="max-width:170px" src="hyzl-logo-stacked-white.svg"><span>hyzl-logo-stacked-white.svg</span></div>
  <div class="card"><img class="logo" src="hyzl-logo-mono-black.svg"><span>mono black</span></div>
  <div class="card dark"><img class="logo" src="hyzl-logo-mono-white.svg"><span>mono white</span></div>
  <div class="card"><img class="icon" src="hyzl-icon.svg"><span>hyzl-icon.svg</span></div>
  <div class="card dark"><img class="icon" src="hyzl-icon-white.svg"><span>hyzl-icon-white.svg</span></div>
  <div class="card"><div class="favrow">
      <img src="favicon-16x16.png" width="16"><img src="favicon-32x32.png" width="32">
      <img src="favicon-48x48.png" width="48"><img src="apple-touch-icon.png" width="90" style="border-radius:18px">
    </div><span>favicons 16 / 32 / 48 + apple-touch-icon</span></div>
</div></body></html>
